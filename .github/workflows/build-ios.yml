name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Read build identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run manual releases from main."
            exit 1
          fi
          APP_VERSION="$(node -p 'require("./app.json").expo.version')"
          BUNDLE_ID="$(node -p 'require("./app.json").expo.ios.bundleIdentifier')"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ -n "$BUNDLE_ID" ]]
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "SHORT_SHA=$SHORT_SHA"
            echo "IPA_NAME=Sport-${APP_VERSION}-build${BUILD_NUMBER}-${SHORT_SHA}.ipa"
            echo "RELEASE_TAG=build-${BUILD_NUMBER}-${SHORT_SHA}"
            echo "RELEASE_TITLE=Sport ${APP_VERSION} — build ${BUILD_NUMBER} — ${SHORT_SHA}"
          } >> "$GITHUB_ENV"

      - name: Install and generate iOS project
        run: |
          npm ci
          grep -Fq 'SportRestLockScreen(propsJSON: context.state.props)' node_modules/expo-widgets/ios/Widgets/WidgetLiveActivity.swift
          grep -Fq 'Text(timerInterval: Date.now...deadline' node_modules/expo-widgets/ios/Widgets/WidgetLiveActivity.swift
          npx expo prebuild --platform ios --no-install

      - name: Verify generated Live Activity target and install Pods
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_MODULES="$RUNNER_TEMP/expo-autolinking-ios.json"
          npx expo-modules-autolinking resolve --platform apple --project-root . --json > "$RESOLVED_MODULES"
          node -e '
            const result = require(process.argv[1]);
            const module = result.modules.find((entry) => entry.packageName === "sport-vault-file-protection");
            if (!module || !module.pods.some((pod) => pod.podName === "SportVaultFileProtection") ||
                !module.modules.some((entry) => entry.class === "SportVaultFileProtectionModule")) {
              throw new Error("The local vault module is not correctly autolinked.");
            }
          ' "$RESOLVED_MODULES"
          INFO_PLIST="ios/Sport/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$INFO_PLIST" | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivitiesFrequentUpdates' "$INFO_PLIST" | grep -qx false
          /usr/libexec/PlistBuddy -c 'Print :ExpoWidgets_EnablePushNotifications' "$INFO_PLIST" | grep -qx false
          grep -q 'PBXNativeTarget "ExpoWidgetsTarget"' ios/Sport.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = "com.raaaton.sport.ExpoWidgetsTarget"' ios/Sport.xcodeproj/project.pbxproj
          test -s ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements | grep -qx 'group.com.raaaton.sport'
          SCENE_DELEGATE="$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' ios/Sport/Info.plist)"
          test "$SCENE_DELEGATE" = "EXExpoAppSceneDelegate"
          grep -q 'ExpoReactNativeFactoryProvider' ios/Sport/AppDelegate.swift
          if grep -Eq 'window = UIWindow\(frame: UIScreen\.main\.bounds\)|factory\.startReactNative\(' ios/Sport/AppDelegate.swift; then
            echo "::error::Expo scene support left the legacy AppDelegate startup in place."
            exit 1
          fi
          (cd ios && pod install)

      - name: Build, verify, and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="ios/Sport/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"
          EXTENSION_SOURCE_INFO="ios/ExpoWidgetsTarget/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$EXTENSION_SOURCE_INFO"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$EXTENSION_SOURCE_INFO"

          DERIVED_DATA="$RUNNER_TEMP/SportDerivedData"
          xcodebuild -quiet \
            -workspace ios/Sport.xcworkspace \
            -scheme Sport \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Sport.app"
          APP_INFO="$APP_PATH/Info.plist"
          test -d "$APP_PATH" && test -s "$APP_INFO"
          EXTENSION_PATH="$APP_PATH/PlugIns/ExpoWidgetsTarget.appex"
          EXTENSION_INFO="$EXTENSION_PATH/Info.plist"
          test -d "$EXTENSION_PATH" && test -s "$EXTENSION_INFO"
          test -s "$EXTENSION_PATH/ExpoWidgets.bundle/ExpoWidgets.bundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXTENSION_INFO")" = "$BUNDLE_ID.ExpoWidgetsTarget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXTENSION_INFO")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXTENSION_INFO")" = "$BUILD_NUMBER"
          test ! -e "$EXTENSION_PATH/embedded.mobileprovision"
          test ! -e "$EXTENSION_PATH/_CodeSignature"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")" = "$BUILD_NUMBER"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_INFO")"
          /usr/bin/lipo -verify_arch arm64 "$APP_PATH/$APP_EXECUTABLE"
          test ! -e "$APP_PATH/embedded.mobileprovision"
          test ! -e "$APP_PATH/_CodeSignature"
          SIGNATURE_OUTPUT="$(codesign --display --verbose=2 "$APP_PATH" 2>&1 || true)"
          grep -q 'code object is not signed at all' <<< "$SIGNATURE_OUTPUT"

          PACKAGE="$RUNNER_TEMP/SportIPAPackage"
          VERIFY="$RUNNER_TEMP/SportIPAVerify"
          IPA_PATH="$RUNNER_TEMP/$IPA_NAME"
          mkdir -p "$PACKAGE/Payload" "$VERIFY"
          ditto "$APP_PATH" "$PACKAGE/Payload/Sport.app"
          (cd "$PACKAGE" && /usr/bin/zip -X -qry "$IPA_PATH" Payload)
          test -s "$IPA_PATH"
          /usr/bin/unzip -t "$IPA_PATH"
          /usr/bin/unzip -q "$IPA_PATH" -d "$VERIFY"
          PACKAGED_APP="$VERIFY/Payload/Sport.app"
          test -s "$PACKAGED_APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$PACKAGED_APP/Info.plist")" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PACKAGED_APP/Info.plist")" = "$BUNDLE_ID"
          PACKAGED_EXTENSION="$PACKAGED_APP/PlugIns/ExpoWidgetsTarget.appex"
          test -s "$PACKAGED_EXTENSION/Info.plist"
          test -s "$PACKAGED_EXTENSION/ExpoWidgets.bundle/ExpoWidgets.bundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PACKAGED_EXTENSION/Info.plist")" = "$BUNDLE_ID.ExpoWidgetsTarget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PACKAGED_EXTENSION/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PACKAGED_EXTENSION/Info.plist")" = "$BUILD_NUMBER"
          test ! -e "$PACKAGED_EXTENSION/embedded.mobileprovision"
          test ! -e "$PACKAGED_EXTENSION/_CodeSignature"
          test ! -e "$PACKAGED_APP/embedded.mobileprovision"
          test ! -e "$PACKAGED_APP/_CodeSignature"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            --latest
          RELEASE_INFO="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets)"
          node -e '
            const release = JSON.parse(process.argv[1]);
            if (release.tagName !== process.argv[2] || release.isPrerelease) process.exit(1);
            if (!release.assets.some((asset) => asset.name === process.argv[3])) process.exit(1);
          ' "$RELEASE_INFO" "$RELEASE_TAG" "$IPA_NAME"
